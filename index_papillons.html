<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte des Papillons du Grand Est</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Plugin Leaflet.pattern -->
  <script src="https://unpkg.com/leaflet.pattern/dist/leaflet.pattern.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #map {
      height: calc(100% - 180px);
      width: 100%;
    }

    #papillons {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 180px;
      background: #f8f8f8;
      border-top: 2px solid #ccc;
      padding: 10px 0;
    }

    .papillon {
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      text-align: center;
      border-radius: 10px;
      padding: 5px 10px;
    }

    .papillon img {
      height: 100px;
      display: block;
      margin: 5px auto;
    }

    .papillon-name {
      font-style: italic;
      font-size: 1.1em;
      margin-bottom: 5px;
    }

    .papillon:hover, .papillon.active {
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      background-color: #eef;
    }

    .label-text {
      font-weight: bold;
      font-size: 14px;
      color: black;
      text-shadow: 0 0 3px white;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="papillons">
    <div class="papillon" data-id="1" data-pattern="images_papillons/pattern_AGLAIS_IO.png">
      <div class="papillon-name"><i>Aglais io</i></div>
      <img src="images_papillons/papillon_AGLAIS_IO.png" alt="Aglais io" />
    </div>
    <div class="papillon" data-id="2" data-pattern="images_papillons/pattern_AGLAIS_URTICAE.png">
      <div class="papillon-name"><i>Aglais urticae</i></div>
      <img src="images_papillons/papillon_AGLAIS_URTICAE.png" alt="Aglais urticae" />
    </div>
    <div class="papillon" data-id="3" data-pattern="images_papillons/pattern_GONEPTERYX_RHAMNI.png">
      <div class="papillon-name"><i>Gonepteryx rhamni</i></div>
      <img src="images_papillons/papillon_GONEPTERYX_RHAMNI.png" alt="Gonepteryx rhamni" />
    </div>
    <div class="papillon" data-id="4" data-pattern="images_papillons/pattern_VANESSA_ATALANTA.png">
      <div class="papillon-name"><i>Vanessa atalanta</i></div>
      <img src="images_papillons/papillon_VANESSA_ATALANTA.png" alt="Vanessa atalanta" />
    </div>
    <div class="papillon" data-id="5" data-pattern="images_papillons/pattern_VANESSA_CARDUI.png">
      <div class="papillon-name"><i>Vanessa cardui</i></div>
      <img src="images_papillons/papillon_VANESSA_CARDUI.png" alt="Vanessa cardui" />
    </div>
  </div>

  <script>
    // Initialisation de la carte
    const map = L.map("map").setView([48.5, 6.5], 7);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
    }).addTo(map);

    let selectedPapillon = null;

    // Sélection du papillon actif
    document.querySelectorAll(".papillon").forEach((el) => {
      el.addEventListener("click", () => {
        document.querySelectorAll(".papillon").forEach((p) => p.classList.remove("active"));
        el.classList.add("active");
        selectedPapillon = {
          id: el.getAttribute("data-id"),
          patternUrl: el.getAttribute("data-pattern"),
        };
      });
    });

    // Chargement du GeoJSON
    fetch("epci_grand-est.geojson")
      .then((res) => res.json())
      .then((data) => {
        const layer = L.geoJSON(data, {
          style: () => ({
            color: "#333",
            weight: 1,
            fillColor: "#dcdcdc",
            fillOpacity: 0.7,
          }),
          onEachFeature: (feature, layer) => {
            // Affiche le numéro "couleur" au centre
            if (feature.properties && feature.properties.couleur) {
              layer.bindTooltip(feature.properties.couleur.toString(), {
                permanent: true,
                direction: "center",
                className: "label-text",
              });
            }

            // Clic sur une zone
            layer.on("click", () => {
              if (!selectedPapillon) return;

              const id = feature.properties.couleur;
              if (id == selectedPapillon.id) {
                const pattern = new L.Pattern({
                  width: 40,
                  height: 40,
                });
                const image = new L.PatternImage({
                  pattern: pattern,
                  x: 0,
                  y: 0,
                  width: 40,
                  height: 40,
                  href: selectedPapillon.patternUrl,
                });
                pattern.addShape(image);
                pattern.addTo(map);

                layer.setStyle({
                  fillPattern: pattern,
                  fillOpacity: 1,
                });
              }
            });
          },
        }).addTo(map);
      });
  </script>
</body>
</html>
