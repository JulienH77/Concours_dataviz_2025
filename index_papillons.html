<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Papillons - remplissage PNG fonctionnel</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { margin: 0; font-family: sans-serif; text-align: center; }
  #papillons { display: flex; justify-content: center; gap: 10px; margin: 10px; }
  .papillon-btn { padding: 5px 10px; border: 1px solid #aaa; border-radius: 6px; cursor: pointer; background: #eee; }
  .papillon-btn.active { background: #f7c948; }
  #map-container { position: relative; width: 1000px; height: 800px; margin: 0 auto; }
  svg { width: 100%; height: 100%; }
  .epci { fill: #fff; stroke: #333; stroke-width: 0.5; cursor: pointer; }
  .flash-red { stroke: red; stroke-width: 2; animation: flash 0.8s; }
  @keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .epci-image {
    position: absolute;
    background-size: cover;
    background-position: center;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="papillons"></div>
<div id="map-container">
  <svg></svg>
</div>

<script>
// --- Configuration papillons
const papillons = [
  {id:1, name:"AGLAIS IO", pattern:"images_papillons/pattern_AGLAIS_IO.png"},
  {id:2, name:"AGLAIS URTICAE", pattern:"images_papillons/pattern_AGLAIS_URTICAE.png"},
  {id:3, name:"GONEPTERYX RHAMNI", pattern:"images_papillons/pattern_GONEPTERYX_RHAMNI.png"},
  {id:4, name:"VANESSA ATALANTA", pattern:"images_papillons/pattern_VANESSA_ATALANTA.png"},
  {id:5, name:"VANESSA CARDUI", pattern:"images_papillons/pattern_VANESSA_CARDUI.png"}
];

let selectedPapillon = null;
const painted = {}; // pour stocker les EPCI déjà peints

// --- Création des boutons papillons
const papDiv = d3.select("#papillons");
papDiv.selectAll("button")
  .data(papillons)
  .enter()
  .append("button")
  .text(d=>d.name)
  .attr("class","papillon-btn")
  .on("click",(event,d)=>{
    selectedPapillon=d;
    d3.selectAll(".papillon-btn").classed("active",false);
    d3.select(event.currentTarget).classed("active",true);
    console.log("Papillon sélectionné:",d);
  });

// --- Carte SVG
const width = 1000, height=800;
const svg = d3.select("svg");
const container = document.getElementById("map-container");

Promise.all([
  d3.json("epci_grand-est.geojson")
]).then(([epci])=>{
  const projection = d3.geoMercator().fitSize([width,height], epci);
  const path = d3.geoPath(projection);

  // --- Dessine les EPCI
  svg.selectAll("path.epci")
    .data(epci.features)
    .enter()
    .append("path")
    .attr("class","epci")
    .attr("d",path)
    .each(function(d,i){
      d.domNode = this; // on garde le DOM pour calculer clip-path plus tard
      d.idx=i;
    })
    .on("click",function(event,d){
      if(!selectedPapillon){
        d3.select(this).classed("flash-red",true);
        setTimeout(()=>d3.select(this).classed("flash-red",false),800);
        return;
      }
      if(String(d.properties.couleur)===String(selectedPapillon.id)){
        // --- Crée un div avec background-image
        const bbox = d.domNode.getBBox();
        const points = path(d).match(/-?[\d.]+/g).map(Number); // extrait tous les points
        const clip = `polygon(${points.filter((p,i)=>i%2===0).map((x,i)=>{return points[i*2]+'px '+points[i*2+1]+'px'}).join(",")})`;

        const div = document.createElement("div");
        div.className="epci-image";
        div.style.left=bbox.x+"px";
        div.style.top=bbox.y+"px";
        div.style.width=bbox.width+"px";
        div.style.height=bbox.height+"px";
        div.style.backgroundImage=`url(${selectedPapillon.pattern})`;
        div.style.clipPath=clip;
        container.appendChild(div);

        // mémorise pour l’œil et la poubelle
        painted[selectedPapillon.id] = painted[selectedPapillon.id]||[];
        painted[selectedPapillon.id].push(div);
      }else{
        d3.select(this).classed("flash-red",true);
        setTimeout(()=>d3.select(this).classed("flash-red",false),800);
      }
    });
});
</script>
</body>
</html>
