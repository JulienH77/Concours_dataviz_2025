<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte des Papillons du Grand Est</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
      background: white;
    }

    #map {
      height: calc(100% - 180px);
      width: 100%;
    }

    #papillons {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 180px;
      background: #f8f8f8;
      border-top: 2px solid #ccc;
      padding: 10px 0;
    }

    .papillon {
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      text-align: center;
      border-radius: 10px;
      padding: 5px 10px;
    }

    .papillon img {
      height: 100px;
      display: block;
      margin: 5px auto;
    }

    .papillon-name {
      font-style: italic;
      font-size: 1.1em;
      margin-bottom: 5px;
    }

    .papillon:hover, .papillon.active {
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      background-color: #eef;
    }

    .label-text {
      font-weight: bold;
      font-size: 14px;
      color: black;
      text-shadow: 0 0 3px white;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="papillons">
    <div class="papillon" data-id="1" data-pattern="images_papillons/pattern_AGLAIS_IO.png">
      <div class="papillon-name"><i>Aglais io</i></div>
      <img src="images_papillons/papillon_AGLAIS_IO.png" alt="Aglais io" />
    </div>
    <div class="papillon" data-id="2" data-pattern="images_papillons/pattern_AGLAIS_URTICAE.png">
      <div class="papillon-name"><i>Aglais urticae</i></div>
      <img src="images_papillons/papillon_AGLAIS_URTICAE.png" alt="Aglais urticae" />
    </div>
    <div class="papillon" data-id="3" data-pattern="images_papillons/pattern_GONEPTERYX_RHAMNI.png">
      <div class="papillon-name"><i>Gonepteryx rhamni</i></div>
      <img src="images_papillons/papillon_GONEPTERYX_RHAMNI.png" alt="Gonepteryx rhamni" />
    </div>
    <div class="papillon" data-id="4" data-pattern="images_papillons/pattern_VANESSA_ATALANTA.png">
      <div class="papillon-name"><i>Vanessa atalanta</i></div>
      <img src="images_papillons/papillon_VANESSA_ATALANTA.png" alt="Vanessa atalanta" />
    </div>
    <div class="papillon" data-id="5" data-pattern="images_papillons/pattern_VANESSA_CARDUI.png">
      <div class="papillon-name"><i>Vanessa cardui</i></div>
      <img src="images_papillons/papillon_VANESSA_CARDUI.png" alt="Vanessa cardui" />
    </div>
  </div>

  <script>
    const map = L.map("map", {
      zoomSnap: 0.5,
      zoomControl: true
    }).setView([48.5, 6.5], 7);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    let selectedPapillon = null;

    document.querySelectorAll(".papillon").forEach((el) => {
      el.addEventListener("click", () => {
        document.querySelectorAll(".papillon").forEach((p) => p.classList.remove("active"));
        el.classList.add("active");
        selectedPapillon = {
          id: el.getAttribute("data-id"),
          patternUrl: el.getAttribute("data-pattern"),
        };
        map.getContainer().style.cursor = "url('https://cdn-icons-png.flaticon.com/512/616/616408.png') 16 16, crosshair";
      });
    });

    function createSvgPattern(url, id) {
      if (document.getElementById(id)) return;
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("width", 0);
      svg.setAttribute("height", 0);

      const defs = document.createElementNS(svgNS, "defs");
      const pattern = document.createElementNS(svgNS, "pattern");
      pattern.setAttribute("id", id);
      pattern.setAttribute("patternUnits", "objectBoundingBox");
      pattern.setAttribute("width", 1);
      pattern.setAttribute("height", 1);

      const image = document.createElementNS(svgNS, "image");
      image.setAttributeNS(null, "href", url);
      image.setAttribute("width", 100);
      image.setAttribute("height", 100);
      image.setAttribute("preserveAspectRatio", "xMidYMid slice");

      pattern.appendChild(image);
      defs.appendChild(pattern);
      svg.appendChild(defs);
      document.body.appendChild(svg);
    }

    // Couche principale des EPCI
    fetch("epci_grand-est.geojson")
      .then(res => res.json())
      .then(data => {
        const epciLayer = L.geoJSON(data, {
          style: {
            color: "#333",
            weight: 1,
            fillColor: "#ffffff",
            fillOpacity: 1
          },
          onEachFeature: (feature, layer) => {
            const bounds = layer.getBounds();
            if (bounds && bounds.isValid() && feature.properties && feature.properties.couleur) {
              const center = bounds.getCenter();
              const label = L.divIcon({
                html: `<div class="label-text">${feature.properties.couleur}</div>`,
                className: "",
                iconSize: [20, 20],
                iconAnchor: [10, 10]
              });
              L.marker(center, { icon: label, interactive: false }).addTo(map);
            }

            layer.on("click", () => {
              if (!selectedPapillon) return;
              if (feature.properties.couleur == selectedPapillon.id) {
                const patternId = `pattern_${selectedPapillon.id}`;
                createSvgPattern(selectedPapillon.patternUrl, patternId);
                if (layer._path) layer._path.setAttribute("fill", `url(#${patternId})`);
              }
            });
          }
        }).addTo(map);

        // Couche par-dessus (corps du papillon)
        fetch("corps_papillon_epci.geojson")
          .then(res => res.json())
          .then(overlay => {
            L.geoJSON(overlay, {
              style: {
                fillColor: "#000000",
                fillOpacity: 0.7,
                stroke: false
              }
            }).addTo(map);
          });

        map.fitBounds(epciLayer.getBounds());
      });
  </script>
</body>
</html>
