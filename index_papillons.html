<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte des Papillons - Test clipPath</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f7f7f7;
      text-align: center;
    }
    #map {
      width: 1000px;
      height: 800px;
      margin: 0 auto;
      border: 1px solid #ccc;
      position: relative;
      background: white;
    }
    #papillons {
      margin-bottom: 20px;
    }
    .papillon-btn {
      padding: 6px 12px;
      margin: 5px;
      cursor: pointer;
      background: #eee;
      border: 1px solid #aaa;
      border-radius: 6px;
    }
    .papillon-btn.active {
      background: #f7c948;
      color: #000;
    }
    .flash-red {
      stroke: red !important;
      stroke-width: 2 !important;
    }
  </style>
</head>
<body>
  <h2>Test remplissage avec PNG (clipPath)</h2>
  <div id="papillons"></div>
  <div id="map"></div>

  <script>
  const width = 1000, height = 800;
  const svg = d3.select("#map")
    .append("svg")
    .attr("width", width)
    .attr("height", height);

  const defs = svg.append("defs");

  let selectedPapillon = null;

  const papillons = [
    { id: 1, name: "AGLAIS IO", patternUrl: "images_papillons/pattern_AGLAIS_IO.png" },
    { id: 2, name: "AGLAIS URTICAE", patternUrl: "images_papillons/pattern_AGLAIS_URTICAE.png" },
    { id: 3, name: "GONEPTERYX RHAMNI", patternUrl: "images_papillons/pattern_GONEPTERYX_RHAMNI.png" },
    { id: 4, name: "VANESSA ATALANTA", patternUrl: "images_papillons/pattern_VANESSA_ATALANTA.png" },
    { id: 5, name: "VANESSA CARDUI", patternUrl: "images_papillons/pattern_VANESSA_CARDUI.png" }
  ];

  // --- Boutons papillons ---
  const buttons = d3.select("#papillons")
    .selectAll("button")
    .data(papillons)
    .enter()
    .append("button")
    .attr("class", "papillon-btn")
    .text(d => d.name)
    .on("click", (event, d) => {
      selectedPapillon = d;
      console.log("Pinceau activé pour", d);
      d3.selectAll(".papillon-btn").classed("active", false);
      d3.select(event.currentTarget).classed("active", true);
    });

  // --- Chargement GeoJSON ---
  Promise.all([
    d3.json("data/epci_grand-est.geojson")
  ]).then(([epci]) => {
    const projection = d3.geoMercator().fitSize([width, height], epci);
    const path = d3.geoPath().projection(projection);

    // --- Groupe principal pour les fonds d’image ---
    const imagesGroup = svg.append("g").attr("class", "image-fills");

    // --- Ajout des clipPaths et des contours ---
    epci.features.forEach((d, i) => {
      const clipId = `clip_epci_${i}`;
      defs.append("clipPath")
        .attr("id", clipId)
        .append("path")
        .attr("d", path(d));

      svg.append("path")
        .attr("class", "epci")
        .attr("d", path(d))
        .attr("fill", "#fff")
        .attr("stroke", "#999")
        .attr("stroke-width", 0.5)
        .on("click", function (event) {
          if (!selectedPapillon) {
            console.log("Aucun papillon sélectionné.");
            d3.select(this).classed("flash-red", true);
            setTimeout(() => d3.select(this).classed("flash-red", false), 500);
            return;
          }

          const papId = selectedPapillon.id;
          const featNum = d.properties.couleur;

          if (featNum == papId) {
            // Crée une image masquée par la forme EPCI
            imagesGroup.append("image")
              .attr("href", selectedPapillon.patternUrl)
              .attr("width", width)
              .attr("height", height)
              .attr("clip-path", `url(#${clipId})`)
              .lower(); // pour passer sous les traits de contour
          } else {
            d3.select(this).classed("flash-red", true);
            setTimeout(() => d3.select(this).classed("flash-red", false), 500);
          }
        });
    });
  });
  </script>
</body>
</html>
