<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Papillons — Vue SVG (sans Leaflet) — version corrigée</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root{--banner-h:120px}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial,sans-serif}
  #svgContainer{height:calc(100% - var(--banner-h));background:#fff;overflow:auto}
  svg{width:100%;height:100%}
  #papillons{
    height:var(--banner-h);
    display:flex;align-items:center;gap:16px;
    padding:8px;border-top:1px solid #ddd;background:#fafafa;
    justify-content:space-around;
  }
  .papillon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px;border-radius:8px;border:1px solid transparent;cursor:pointer;width:130px}
  .papillon.active{background:#eef;border-color:#77a}
  .pap-img{width:84px;height:84px;object-fit:cover;border-radius:6px}
  .pap-label{font-style:italic;font-size:14px;text-align:center}
  .pap-controls{display:flex;flex-direction:row;gap:8px;margin-top:4px}
  .control-btn{background:transparent;border:0;font-size:18px;cursor:pointer;opacity:0.75}
  .control-btn.active{opacity:1}
  .control-btn:hover{opacity:1}
  text.label{font-size:12px;font-weight:700;fill:#000;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
  .epci{stroke:#333;stroke-width:0.5;fill:#fff}
  .corps-layer{fill:rgba(0,0,0,0.7);pointer-events:none}
  /* petit style pour feedback erreur */
  .flash-red { animation: flashred 900ms; }
  @keyframes flashred { 0% { fill: #ffbdbd } 50% { fill: #ff9b9b } 100% { } }
</style>
</head>
<body>

<div id="svgContainer"><svg id="svg"></svg></div>

<div id="papillons">
  <div class="papillon" data-id="1" data-pattern="images_papillons/pattern_AGLAIS_IO.png">
    <img class="pap-img" src="images_papillons/papillon_AGLAIS_IO.png" alt="Aglais io">
    <div class="pap-label"><i>Aglais io</i></div>
    <div class="pap-controls">
      <button class="control-btn brush" title="Pinceau">🖌️</button>
      <button class="control-btn eye" title="Montrer/Masquer">👁️</button>
      <button class="control-btn trash" title="Reset">🗑️</button>
    </div>
  </div>

  <div class="papillon" data-id="2" data-pattern="images_papillons/pattern_AGLAIS_URTICAE.png">
    <img class="pap-img" src="images_papillons/papillon_AGLAIS_URTICAE.png" alt="Aglais urticae">
    <div class="pap-label"><i>Aglais urticae</i></div>
    <div class="pap-controls">
      <button class="control-btn brush">🖌️</button>
      <button class="control-btn eye">👁️</button>
      <button class="control-btn trash">🗑️</button>
    </div>
  </div>

  <div class="papillon" data-id="3" data-pattern="images_papillons/pattern_GONEPTERYX_RHAMNI.png">
    <img class="pap-img" src="images_papillons/papillon_GONEPTERYX_RHAMNI.png" alt="Gonepteryx rhamni">
    <div class="pap-label"><i>Gonepteryx rhamni</i></div>
    <div class="pap-controls">
      <button class="control-btn brush">🖌️</button>
      <button class="control-btn eye">👁️</button>
      <button class="control-btn trash">🗑️</button>
    </div>
  </div>

  <div class="papillon" data-id="4" data-pattern="images_papillons/pattern_VANESSA_ATALANTA.png">
    <img class="pap-img" src="images_papillons/papillon_VANESSA_ATALANTA.png" alt="Vanessa atalanta">
    <div class="pap-label"><i>Vanessa atalanta</i></div>
    <div class="pap-controls">
      <button class="control-btn brush">🖌️</button>
      <button class="control-btn eye">👁️</button>
      <button class="control-btn trash">🗑️</button>
    </div>
  </div>

  <div class="papillon" data-id="5" data-pattern="images_papillons/pattern_VANESSA_CARDUI.png">
    <img class="pap-img" src="images_papillons/papillon_VANESSA_CARDUI.png" alt="Vanessa cardui">
    <div class="pap-label"><i>Vanessa cardui</i></div>
    <div class="pap-controls">
      <button class="control-btn brush">🖌️</button>
      <button class="control-btn eye">👁️</button>
      <button class="control-btn trash">🗑️</button>
    </div>
  </div>
</div>

<script>
/* ---------- helpers ---------- */
const svg = d3.select("#svg");
const container = document.getElementById("svgContainer");

function drawAll() {
  // clear svg
  svg.selectAll("*").remove();

  const w = container.clientWidth || Math.max(window.innerWidth,800);
  const h = container.clientHeight || Math.max(window.innerHeight - 120,400);
  svg.attr("viewBox", `0 0 ${w} ${h}`);

  // re-run drawing with fresh sizes
  runDraw(w,h);
}

/* track state */
let selectedPapillon = null;
const painted = {}; // painted[papId] = Set(feature_idx)
const patternIdsCreated = new Set();

/* create pattern with objectBoundingBox so it covers whole polygon */
function createPattern(url, pid) {
  if (patternIdsCreated.has(pid)) return;
  const defs = svg.append("defs");
  defs.append("pattern")
    .attr("id", pid)
    .attr("patternUnits", "objectBoundingBox")
    .attr("width", 1)
    .attr("height", 1)
    .append("image")
    .attr("href", url)
    .attr("width", 1)
    .attr("height", 1)
    .attr("preserveAspectRatio","xMidYMid slice");
  patternIdsCreated.add(pid);
}

/* main draw that uses provided width/height */
function runDraw(width, height) {
  Promise.all([
    d3.json("epci_grand-est.geojson"),
    d3.json("corps_papillon_epci.geojson")
  ]).then(([epci, corps]) => {

    // projection & path
    const projection = d3.geoMercator();
    const path = d3.geoPath(projection);

    // fit to size using fitSize (robust)
    projection.fitSize([width, height], epci);

    // ensure stable indexes
    epci.features.forEach((f,i)=> f._idx = i);

    const g = svg.append("g");

    // draw EPCI
    const zones = g.selectAll("path.epci")
      .data(epci.features)
      .enter()
      .append("path")
      .attr("class","epci")
      .attr("d", path)
      .attr("fill", "#ffffff")
      .attr("stroke", "#333")
      .attr("data-idx", d => d._idx)
      .on("click", function(event, d){
        if (!selectedPapillon) return;
        const papId = String(selectedPapillon.id);
        const featNum = String(d.properties.couleur);
        if (featNum === papId) {
          painted[papId] = painted[papId] || new Set();
          painted[papId].add(d._idx);
          const pid = `pattern_${papId}`;
          createPattern(selectedPapillon.patternUrl, pid);
          d3.select(this).attr("fill", `url(#${pid})`);
        } else {
          // flash red
          flashWrong(this);
        }
      });

    // labels centered
    g.selectAll("text.label")
      .data(epci.features)
      .enter()
      .append("text")
      .attr("class","label")
      .attr("x", d => path.centroid(d)[0])
      .attr("y", d => path.centroid(d)[1])
      .text(d => d.properties.couleur);

    // overlay corps (above) but pointer-events none so clicks pass through
    g.selectAll("path.corps")
      .data(corps.features)
      .enter()
      .append("path")
      .attr("class","corps-layer")
      .attr("d", path)
      .attr("fill","rgba(0,0,0,0.7)")
      .attr("stroke","none")
      .style("pointer-events","none");

    // setup UI hooks (one-time event binding safe because we recreate patterns etc.)
    setupUI(zones);
  }).catch(err => console.error("Erreur chargement geojson:", err));
}

/* flash red animation for wrong clicks */
function flashWrong(node) {
  const sel = d3.select(node);
  // add a temporary class that animates via CSS
  sel.classed("flash-red", true);
  setTimeout(()=> sel.classed("flash-red", false), 900);
}

/* UI wiring: papillon buttons */
function setupUI(zones) {
  document.querySelectorAll(".papillon").forEach(p => {
    const id = p.dataset.id;
    const patternUrl = p.dataset.pattern;
    const brushBtn = p.querySelector(".brush");
    const eyeBtn = p.querySelector(".eye");
    const trashBtn = p.querySelector(".trash");

    // precreate pattern
    createPattern(patternUrl, `pattern_${id}`);

    // click whole papillon: select + brush
    p.onclick = (e) => {
      if (e.target.closest(".control-btn")) return; // avoid double when clicking a button
      document.querySelectorAll(".papillon").forEach(x=>x.classList.remove("active"));
      p.classList.add("active");
      document.querySelectorAll(".control-btn.brush").forEach(b=>b.classList.remove("active"));
      brushBtn.classList.add("active");
      selectedPapillon = { id: id, patternUrl: patternUrl };
    };

    // brush button
    brushBtn.onclick = (e) => {
      e.stopPropagation();
      document.querySelectorAll(".papillon").forEach(x=>x.classList.remove("active"));
      p.classList.add("active");
      document.querySelectorAll(".control-btn.brush").forEach(b=>b.classList.remove("active"));
      brushBtn.classList.add("active");
      selectedPapillon = { id: id, patternUrl: patternUrl };
    };

    // eye button: toggle painted for this papillon
    eyeBtn.onclick = (e) => {
      e.stopPropagation();
      const show = !eyeBtn.classList.contains("active");
      eyeBtn.classList.toggle("active", show);
      zones.each(function(d){
        const idx = d._idx;
        const paintedFor = painted[id];
        if (paintedFor && paintedFor.has(idx)) {
          const node = d3.select(this);
          if (show) {
            node.attr("fill", `url(#pattern_${id})`);
          } else {
            node.attr("fill", "#ffffff");
          }
        }
      });
    };

    // trash: reset this species
    trashBtn.onclick = (e) => {
      e.stopPropagation();
      painted[id] = new Set();
      zones.each(function(d){
        if (String(d.properties.couleur) === String(id)) {
          d3.select(this).attr("fill", "#ffffff");
        }
      });
      eyeBtn.classList.remove("active");
    };
  });
}

/* redraw on resize without reload: debounce */
let resizeTimer = null;
window.addEventListener("resize", ()=> {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawAll, 250);
});

/* initial draw */
drawAll();
</script>
</body>
</html>
