<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte des Papillons du Grand Est</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
      background: white;
    }

    #map {
      height: calc(100% - 180px);
      width: 100%;
      background: white;
    }

    #papillons {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 180px;
      background: #f8f8f8;
      border-top: 2px solid #ccc;
      padding: 10px 0;
    }

    .papillon {
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      text-align: center;
      border-radius: 10px;
      padding: 5px 10px;
    }

    .papillon img {
      height: 100px;
      display: block;
      margin: 5px auto;
    }

    .papillon-name {
      font-style: italic;
      font-size: 1.1em;
      margin-bottom: 5px;
    }

    .papillon:hover, .papillon.active {
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      background-color: #eef;
    }

    .label-text {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      font-weight: bold;
      font-size: 14px;
      color: #000;
      text-shadow: 0 0 2px white;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="papillons">
    <div class="papillon" data-id="1" data-pattern="images_papillons/pattern_AGLAIS_IO.png">
      <div class="papillon-name"><i>Aglais io</i></div>
      <img src="images_papillons/papillon_AGLAIS_IO.png" alt="Aglais io" />
    </div>
    <div class="papillon" data-id="2" data-pattern="images_papillons/pattern_AGLAIS_URTICAE.png">
      <div class="papillon-name"><i>Aglais urticae</i></div>
      <img src="images_papillons/papillon_AGLAIS_URTICAE.png" alt="Aglais urticae" />
    </div>
    <div class="papillon" data-id="3" data-pattern="images_papillons/pattern_GONEPTERYX_RHAMNI.png">
      <div class="papillon-name"><i>Gonepteryx rhamni</i></div>
      <img src="images_papillons/papillon_GONEPTERYX_RHAMNI.png" alt="Gonepteryx rhamni" />
    </div>
    <div class="papillon" data-id="4" data-pattern="images_papillons/pattern_VANESSA_ATALANTA.png">
      <div class="papillon-name"><i>Vanessa atalanta</i></div>
      <img src="images_papillons/papillon_VANESSA_ATALANTA.png" alt="Vanessa atalanta" />
    </div>
    <div class="papillon" data-id="5" data-pattern="images_papillons/pattern_VANESSA_CARDUI.png">
      <div class="papillon-name"><i>Vanessa cardui</i></div>
      <img src="images_papillons/papillon_VANESSA_CARDUI.png" alt="Vanessa cardui" />
    </div>
  </div>

  <script>
const map = L.map("map").setView([48.5, 6.5], 7); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap contributors", }).addTo(map);


    
    let selectedPapillon = null;

    // Sélection d’un papillon
    document.querySelectorAll(".papillon").forEach((el) => {
      el.addEventListener("click", () => {
        document.querySelectorAll(".papillon").forEach((p) => p.classList.remove("active"));
        el.classList.add("active");
        selectedPapillon = {
          id: el.getAttribute("data-id"),
          patternUrl: el.getAttribute("data-pattern"),
        };
        map.getContainer().style.cursor = "crosshair";
      });
    });

    // Crée un pattern SVG (si pas déjà créé)
    function createSvgPattern(url, id) {
      if (document.getElementById(id)) return;
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("width", 0);
      svg.setAttribute("height", 0);

      const defs = document.createElementNS(svgNS, "defs");
      const pattern = document.createElementNS(svgNS, "pattern");
      pattern.setAttribute("id", id);
      pattern.setAttribute("patternUnits", "userSpaceOnUse");
      pattern.setAttribute("width", 100);
      pattern.setAttribute("height", 100);

      const image = document.createElementNS(svgNS, "image");
      image.setAttributeNS(null, "href", url);
      image.setAttribute("width", 100);
      image.setAttribute("height", 100);

      pattern.appendChild(image);
      defs.appendChild(pattern);
      svg.appendChild(defs);
      document.body.appendChild(svg);
    }

    // Calcul du centroïde (approximatif)
    function getCentroid(coords) {
      let latSum = 0, lngSum = 0, count = 0;
      coords[0].forEach(c => {
        latSum += c[1];
        lngSum += c[0];
        count++;
      });
      return [latSum / count, lngSum / count];
    }

    // Chargement du GeoJSON
    fetch("epci_grand-est.geojson")
      .then(res => res.json())
      .then(data => {
        const geoLayer = L.geoJSON(data, {
          style: {
            color: "#333",
            weight: 1,
            fillColor: "#ffffff",
            fillOpacity: 1.0,
          },
          onEachFeature: (feature, layer) => {
            if (feature.properties.couleur) {
              const coords = feature.geometry.type === "Polygon"
                ? getCentroid(feature.geometry.coordinates[0])
                : getCentroid(feature.geometry.coordinates[0][0]);

              const divIcon = L.divIcon({
                html: `<div class="label-text">${feature.properties.couleur}</div>`,
                className: "",
                iconSize: null,
              });
              L.marker([coords[0], coords[1]], { icon: divIcon, interactive: false }).addTo(map);
            }

            layer.on("click", () => {
              if (!selectedPapillon) return;
              if (feature.properties.couleur == selectedPapillon.id) {
                const patternId = `pattern_${selectedPapillon.id}`;
                createSvgPattern(selectedPapillon.patternUrl, patternId);
                layer._path.setAttribute("fill", `url(#${patternId})`);
              }
            });
          },
        }).addTo(map);

        map.fitBounds(geoLayer.getBounds());
      });
  </script>
</body>
</html>
