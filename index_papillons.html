<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papillons du Grand Est — Vue statique interactive</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
  body {
    font-family: "Segoe UI", sans-serif;
    margin: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  #svgContainer {
    flex: 1;
    overflow: hidden;
    background: white;
  }

  svg {
    width: 100%;
    height: 100%;
  }

  #papillons {
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 140px; /* plus compact */
    border-top: 2px solid #ccc;
    background: #f8f8f8;
    padding: 5px;
  }

  .papillon {
    cursor: pointer;
    text-align: center;
    border-radius: 10px;
    padding: 5px 10px;
    transition: transform 0.3s, box-shadow 0.3s;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    border: 1px solid transparent;
  }

  .papillon.active {
    background: #eef;
    border-color: #66f;
  }

  .papillon img {
    height: 80px;
    display: block;
  }

  .papillon-name {
    font-style: italic;
    margin-bottom: 5px;
    font-size: 1em;
  }

  .papillon-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .control-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    opacity: 0.6;
    transition: 0.2s;
  }

  .control-btn:hover, .control-btn.active {
    opacity: 1;
  }

  text.label {
    font-size: 11px;
    font-weight: bold;
    fill: black;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
  }

  .corps-layer {
    pointer-events: none; /* pour ne pas bloquer les clics */
  }
</style>
</head>
<body>

<div id="svgContainer">
  <svg id="map"></svg>
</div>

<div id="papillons">
  <div class="papillon" data-id="1" data-pattern="images_papillons/pattern_AGLAIS_IO.png">
    <div>
      <div class="papillon-name"><i>Aglais io</i></div>
      <img src="images_papillons/papillon_AGLAIS_IO.png" alt="Aglais io">
    </div>
    <div class="papillon-controls">
      <button class="control-btn brush">🖌️</button>
      <button class="control-btn eye">👁️</button>
      <button class="control-btn trash">🗑️</button>
    </div>
  </div>

  <div class="papillon" data-id="2" data-pattern="images_papillons/pattern_AGLAIS_URTICAE.png">
    <div>
      <div class="papillon-name"><i>Aglais urticae</i></div>
      <img src="images_papillons/papillon_AGLAIS_URTICAE.png" alt="Aglais urticae">
    </div>
    <div class="papillon-controls">
      <button class="control-btn brush">🖌️</button>
      <button class="control-btn eye">👁️</button>
      <button class="control-btn trash">🗑️</button>
    </div>
  </div>

  <div class="papillon" data-id="3" data-pattern="images_papillons/pattern_GONEPTERYX_RHAMNI.png">
    <div>
      <div class="papillon-name"><i>Gonepteryx rhamni</i></div>
      <img src="images_papillons/papillon_GONEPTERYX_RHAMNI.png" alt="Gonepteryx rhamni">
    </div>
    <div class="papillon-controls">
      <button class="control-btn brush">🖌️</button>
      <button class="control-btn eye">👁️</button>
      <button class="control-btn trash">🗑️</button>
    </div>
  </div>

  <div class="papillon" data-id="4" data-pattern="images_papillons/pattern_VANESSA_ATALANTA.png">
    <div>
      <div class="papillon-name"><i>Vanessa atalanta</i></div>
      <img src="images_papillons/papillon_VANESSA_ATALANTA.png" alt="Vanessa atalanta">
    </div>
    <div class="papillon-controls">
      <button class="control-btn brush">🖌️</button>
      <button class="control-btn eye">👁️</button>
      <button class="control-btn trash">🗑️</button>
    </div>
  </div>

  <div class="papillon" data-id="5" data-pattern="images_papillons/pattern_VANESSA_CARDUI.png">
    <div>
      <div class="papillon-name"><i>Vanessa cardui</i></div>
      <img src="images_papillons/papillon_VANESSA_CARDUI.png" alt="Vanessa cardui">
    </div>
    <div class="papillon-controls">
      <button class="control-btn brush">🖌️</button>
      <button class="control-btn eye">👁️</button>
      <button class="control-btn trash">🗑️</button>
    </div>
  </div>
</div>

<script>
const svg = d3.select("#map");
const g = svg.append("g");

let selectedPapillon = null;
let painted = {}; // pour garder en mémoire les EPCI coloriés par papillon

// Crée un motif SVG à partir d'une image
function createPattern(url, id) {
  if (document.getElementById(id)) return;
  const defs = svg.append("defs");
  defs.append("pattern")
    .attr("id", id)
    .attr("patternUnits", "objectBoundingBox")
    .attr("width", 1)
    .attr("height", 1)
    .append("image")
    .attr("href", url)
    .attr("width", 100)
    .attr("height", 100)
    .attr("preserveAspectRatio", "xMidYMid slice");
}

// Charger les deux GeoJSON
Promise.all([
  d3.json("epci_grand-est.geojson"),
  d3.json("corps_papillon_epci.geojson")
]).then(([epci, corps]) => {

  const projection = d3.geoMercator().fitSize([window.innerWidth, window.innerHeight - 140], epci);
  const path = d3.geoPath().projection(projection);

  const zones = g.selectAll("path.epci")
    .data(epci.features)
    .enter()
    .append("path")
    .attr("class", "epci")
    .attr("d", path)
    .attr("fill", "#ffffff")
    .attr("stroke", "#333")
    .attr("stroke-width", 0.5)
    .on("click", function(event, d) {
      if (!selectedPapillon) return;
      const papId = selectedPapillon.id;
      const patternId = `pattern_${papId}`;
      painted[papId] = painted[papId] || new Set();

      const isPainted = painted[papId].has(d.properties.couleur);

      if (isPainted) {
        painted[papId].delete(d.properties.couleur);
        d3.select(this).attr("fill", "#ffffff");
      } else {
        painted[papId].add(d.properties.couleur);
        d3.select(this).attr("fill", `url(#${patternId})`);
      }
    });

  // Labels
  g.selectAll("text.label")
    .data(epci.features)
    .enter()
    .append("text")
    .attr("class", "label")
    .attr("x", d => path.centroid(d)[0])
    .attr("y", d => path.centroid(d)[1])
    .text(d => d.properties.couleur);

  // Couche noire par-dessus
  g.selectAll("path.corps")
    .data(corps.features)
    .enter()
    .append("path")
    .attr("class", "corps-layer")
    .attr("d", path)
    .attr("fill", "rgba(0,0,0,0.7)");

  // Gestion des interactions du bandeau
  document.querySelectorAll(".papillon").forEach(p => {
    const id = p.getAttribute("data-id");
    const patternUrl = p.getAttribute("data-pattern");
    const brushBtn = p.querySelector(".brush");
    const eyeBtn = p.querySelector(".eye");
    const trashBtn = p.querySelector(".trash");

    createPattern(patternUrl, `pattern_${id}`);

    // Sélection principale
    p.addEventListener("click", () => {
      document.querySelectorAll(".papillon").forEach(x => x.classList.remove("active"));
      p.classList.add("active");
      selectedPapillon = { id, patternUrl };
    });

    // Pinceau = active aussi
    brushBtn.addEventListener("click", e => {
      e.stopPropagation();
      document.querySelectorAll(".control-btn.brush").forEach(b => b.classList.remove("active"));
      brushBtn.classList.add("active");
      selectedPapillon = { id, patternUrl };
    });

    // Œil = masque / affiche les zones peintes
    eyeBtn.addEventListener("click", e => {
      e.stopPropagation();
      const visible = !eyeBtn.classList.contains("active");
      eyeBtn.classList.toggle("active", visible);

      zones.each(function(d) {
        if (painted[id]?.has(d.properties.couleur)) {
          d3.select(this).attr("fill", visible ? `url(#pattern_${id})` : "#ffffff");
        }
      });
    });

    // Poubelle = reset complet
    trashBtn.addEventListener("click", e => {
      e.stopPropagation();
      painted[id] = new Set();
      zones.filter(d => d.properties.couleur == id).attr("fill", "#ffffff");
    });
  });
});
</script>
</body>
</html>
