<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papillons du Grand Est — Vue statique</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
  body {
    font-family: "Segoe UI", sans-serif;
    margin: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  #svgContainer {
    flex: 1;
    overflow: auto;
    background: white;
  }

  svg {
    width: 100%;
    height: 100%;
  }

  #papillons {
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 180px;
    border-top: 2px solid #ccc;
    background: #f8f8f8;
  }

  .papillon {
    cursor: pointer;
    text-align: center;
    border-radius: 10px;
    padding: 5px 10px;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .papillon:hover, .papillon.active {
    transform: scale(1.1);
    background: #eef;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
  }

  .papillon img {
    height: 100px;
    display: block;
    margin: 5px auto;
  }

  .papillon-name {
    font-style: italic;
    margin-bottom: 5px;
  }

  text.label {
    font-size: 12px;
    font-weight: bold;
    fill: black;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="svgContainer">
  <svg id="map"></svg>
</div>

<div id="papillons">
  <div class="papillon" data-id="1" data-pattern="images_papillons/pattern_AGLAIS_IO.png">
    <div class="papillon-name"><i>Aglais io</i></div>
    <img src="images_papillons/papillon_AGLAIS_IO.png" alt="Aglais io">
  </div>
  <div class="papillon" data-id="2" data-pattern="images_papillons/pattern_AGLAIS_URTICAE.png">
    <div class="papillon-name"><i>Aglais urticae</i></div>
    <img src="images_papillons/papillon_AGLAIS_URTICAE.png" alt="Aglais urticae">
  </div>
  <div class="papillon" data-id="3" data-pattern="images_papillons/pattern_GONEPTERYX_RHAMNI.png">
    <div class="papillon-name"><i>Gonepteryx rhamni</i></div>
    <img src="images_papillons/papillon_GONEPTERYX_RHAMNI.png" alt="Gonepteryx rhamni">
  </div>
  <div class="papillon" data-id="4" data-pattern="images_papillons/pattern_VANESSA_ATALANTA.png">
    <div class="papillon-name"><i>Vanessa atalanta</i></div>
    <img src="images_papillons/papillon_VANESSA_ATALANTA.png" alt="Vanessa atalanta">
  </div>
  <div class="papillon" data-id="5" data-pattern="images_papillons/pattern_VANESSA_CARDUI.png">
    <div class="papillon-name"><i>Vanessa cardui</i></div>
    <img src="images_papillons/papillon_VANESSA_CARDUI.png" alt="Vanessa cardui">
  </div>
</div>

<script>
const svg = d3.select("#map");
const g = svg.append("g");

let selectedPapillon = null;

// Fonction de création d’un motif SVG à partir d’une image
function createPattern(url, id) {
  if (document.getElementById(id)) return;
  const defs = svg.append("defs");
  defs.append("pattern")
    .attr("id", id)
    .attr("patternUnits", "objectBoundingBox")
    .attr("width", 1)
    .attr("height", 1)
    .append("image")
    .attr("href", url)
    .attr("width", 100)
    .attr("height", 100)
    .attr("preserveAspectRatio", "xMidYMid slice");
}

// Charger le GeoJSON principal
Promise.all([
  d3.json("epci_grand-est.geojson"),
  d3.json("corps_papillon_epci.geojson")
]).then(([epci, corps]) => {

  const projection = d3.geoMercator().fitSize([window.innerWidth, window.innerHeight - 180], epci);
  const path = d3.geoPath().projection(projection);

  // Polygones des EPCI
  const zones = g.selectAll("path.epci")
    .data(epci.features)
    .enter()
    .append("path")
    .attr("class", "epci")
    .attr("d", path)
    .attr("fill", "#ffffff")
    .attr("stroke", "#333")
    .attr("stroke-width", 0.5);

  // Labels au centre
  g.selectAll("text.label")
    .data(epci.features)
    .enter()
    .append("text")
    .attr("class", "label")
    .attr("x", d => path.centroid(d)[0])
    .attr("y", d => path.centroid(d)[1])
    .text(d => d.properties.couleur);

  // Couche noire semi-transparente au-dessus
  g.selectAll("path.corps")
    .data(corps.features)
    .enter()
    .append("path")
    .attr("class", "corps")
    .attr("d", path)
    .attr("fill", "rgba(0,0,0,0.7)")
    .attr("stroke", "none");

  // Interaction avec les papillons
  document.querySelectorAll(".papillon").forEach(el => {
    el.addEventListener("click", () => {
      document.querySelectorAll(".papillon").forEach(p => p.classList.remove("active"));
      el.classList.add("active");
      selectedPapillon = {
        id: el.getAttribute("data-id"),
        patternUrl: el.getAttribute("data-pattern")
      };
      const patternId = `pattern_${selectedPapillon.id}`;
      createPattern(selectedPapillon.patternUrl, patternId);

      // Remplir les EPCI correspondants
      zones.transition().duration(500)
        .attr("fill", d => d.properties.couleur == selectedPapillon.id
          ? `url(#${patternId})`
          : "#ffffff");
    });
  });
});
</script>
</body>
</html>
