<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Exploration — Grand Est</title>

<style>
  :root{
    --accent-bird: #2e7d32;
    --accent-butterfly: #b94fb9;
    --bg-bird: #e9f5ee;
    --bg-butterfly: #fdf3fa;
  }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family: "Montserrat", system-ui, sans-serif;
    overflow:hidden;
  }

  /* --- Conteneur global en deux colonnes --- */
  .split{
    display:flex;
    height:100vh;
    width:100%;
  }

  .side{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#234;
    position:relative;
    transition: flex 0.5s ease;
    overflow:hidden;
  }

  .side:hover{
    flex:1.2;
  }

  /* --- Oiseaux --- */
  .birds{
    background:linear-gradient(to bottom, var(--bg-bird), #f7fcff);
  }

  /* --- Papillons --- */
  .butterflies{
    background:linear-gradient(to bottom, var(--bg-butterfly), #fff);
  }

  /* --- Titre principal --- */
  h1{
    font-family: "Playfair Display", serif;
    font-size:40px;
    color:inherit;
    margin-bottom:30px;
  }

  /* --- Bouton principal --- */
  .cta-big{
    padding:20px 36px;
    border-radius:40px;
    font-size:20px;
    font-weight:600;
    text-decoration:none;
    color:white;
    transition: all .2s ease;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }

  .birds .cta-big{
    background: var(--accent-bird);
  }
  .birds .cta-big:hover{
    background:#3aa34a;
  }

  .butterflies .cta-big{
    background: var(--accent-butterfly);
  }
  .butterflies .cta-big:hover{
    background:#d665d6;
  }

  /* --- Bouton secondaire (petite carte) --- */
  .cta-small{
    margin-top:18px;
    background:rgba(255,255,255,0.8);
    color:#333;
    font-size:16px;
    padding:10px 18px;
    border-radius:30px;
    border:2px solid rgba(0,0,0,0.1);
    cursor:pointer;
    transition:all .2s ease;
  }
  .cta-small:hover{
    background:white;
    transform:translateY(-2px);
  }

  /* --- Fenêtre modale de la carte --- */
  .map-overlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    backdrop-filter: blur(3px);
    justify-content:center;
    align-items:center;
    z-index:100;
  }

  .map-overlay.active{
    display:flex;
    animation:fadeIn 0.3s ease forwards;
  }

  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }

  .map-container{
    position:relative;
    max-width:90%;
    max-height:90%;
  }

  .map-container img{
    width:100%;
    height:auto;
    border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
  }

  /* --- Bouton de fermeture --- */
  .close-btn{
    position:absolute;
    top:10px;
    right:10px;
    background:rgba(255,255,255,0.9);
    border:none;
    border-radius:50%;
    font-size:20px;
    width:38px;
    height:38px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    transition:background .2s ease;
  }
  .close-btn:hover{
    background:white;
  }

  /* --- Responsive --- */
  @media(max-width:900px){
    .split{
      flex-direction:column;
    }
    h1{
      font-size:28px;
    }
    .cta-big{
      font-size:18px;
      padding:16px 30px;
    }
  }
</style>
</head>
<body>

<div class="split">
  <!-- Colonne Oiseaux -->
  <div class="side birds">
    <h1>Oiseaux du Grand Est</h1>
    <a href="index_oiseaux.html" class="cta-big">Explorer les Oiseaux</a>
  </div>

  <!-- Colonne Papillons -->
  <div class="side butterflies">
    <h1>Papillons du Grand Est</h1>
    <a href="index_papillons.html" class="cta-big">Explorer les Papillons</a>
    <button class="cta-small" id="showMapBtn">Voir la carte</button>
  </div>
</div>

<!-- Pop-up plein écran -->
<div class="map-overlay" id="mapOverlay">
  <div class="map-container">
    <button class="close-btn" id="closeMapBtn">&times;</button>
    <img src="carte papillon.jpeg" alt="Carte des papillons du Grand Est">
  </div>
</div>

<script>
  const overlay = document.getElementById('mapOverlay');
  const showBtn = document.getElementById('showMapBtn');
  const closeBtn = document.getElementById('closeMapBtn');

  showBtn.addEventListener('click', () => {
    overlay.classList.add('active');
  });

  closeBtn.addEventListener('click', () => {
    overlay.classList.remove('active');
  });

  // Fermer si on clique en dehors de la carte
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay){
      overlay.classList.remove('active');
    }
  });
</script>

</body>
</html>
