<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Exploration — Grand Est</title>

<style>
  :root{
    --accent-bird: #2e7d32;
    --accent-butterfly: #b94fb9;
    --bg-bird: #e9f5ee;
    --bg-butterfly: #fdf3fa;
  }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family: "Montserrat", system-ui, sans-serif;
    overflow:hidden;
  }

  /* --- Conteneur global en deux colonnes --- */
  .split{
    display:flex;
    height:100vh;
    width:100%;
  }

  .side{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#234;
    position:relative;
    transition: flex 0.5s ease;
    overflow:hidden;
  }

  .side:hover{
    flex:1.2;
  }

  /* --- Oiseaux --- */
  .birds{
    background:linear-gradient(to bottom, var(--bg-bird), #f7fcff);
  }

  /* --- Papillons --- */
  .butterflies{
    background:linear-gradient(to bottom, var(--bg-butterfly), #fff);
  }

  /* --- Titre principal --- */
  h1{
    font-family: "Playfair Display", serif;
    font-size:40px;
    color:inherit;
    margin-bottom:30px;
  }

  /* --- Bouton principal --- */
  .cta-big{
    padding:20px 36px;
    border-radius:40px;
    font-size:20px;
    font-weight:600;
    text-decoration:none;
    color:white;
    transition: all .2s ease;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }

  .birds .cta-big{
    background: var(--accent-bird);
  }
  .birds .cta-big:hover{
    background:#3aa34a;
  }

  .butterflies .cta-big{
    background: var(--accent-butterfly);
  }
  .butterflies .cta-big:hover{
    background:#d665d6;
  }

  /* --- Bouton secondaire (petite carte) --- */
  .cta-small{
    margin-top:18px;
    background:rgba(255,255,255,0.8);
    color:#333;
    font-size:16px;
    padding:10px 18px;
    border-radius:30px;
    border:2px solid rgba(0,0,0,0.1);
    cursor:pointer;
    transition:all .2s ease;
  }
  .cta-small:hover{
    background:white;
    transform:translateY(-2px);
  }

  /* --- Image carte (affichée via JS) --- */
  #map{
    position:fixed;
    bottom:20px;
    right:20px;
    max-width:400px;
    border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
    display:none;
    z-index:50;
  }

  /* --- Responsive --- */
  @media(max-width:900px){
    .split{
      flex-direction:column;
    }
    h1{
      font-size:28px;
    }
    .cta-big{
      font-size:18px;
      padding:16px 30px;
    }
  }
</style>
</head>
<body>

<div class="split">
  <!-- Colonne Oiseaux -->
  <div class="side birds">
    <h1>Oiseaux du Grand Est</h1>
    <a href="index_oiseaux.html" class="cta-big">Explorer les Oiseaux</a>
  </div>

  <!-- Colonne Papillons -->
  <div class="side butterflies">
    <h1>Papillons du Grand Est</h1>
    <a href="index_papillons.html" class="cta-big">Explorer les Papillons</a>
    <button class="cta-small" id="showMapBtn">Voir la carte</button>
  </div>
</div>

<!-- Image de la carte -->
<img id="map" src="carte papillon.jpeg" alt="Carte des papillons du Grand Est">

<script>
  const map = document.getElementById('map');
  const btn = document.getElementById('showMapBtn');

  btn.addEventListener('click', ()=>{
    if(map.style.display === 'none'){
      map.style.display = 'block';
      btn.textContent = 'Fermer la carte';
    } else {
      map.style.display = 'none';
      btn.textContent = 'Voir la carte';
    }
  });
</script>

</body>
</html>
