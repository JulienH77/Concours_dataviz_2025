<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploration — Grand Est</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #101820 0%, #000 100%);
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    color: white;
  }

  /* Effet de particules en fond */
  canvas#background {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 0;
  }

  .container {
    display: flex;
    gap: 80px;
    z-index: 2;
  }

  .choice {
    width: 300px;
    height: 400px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1), box-shadow 0.6s;
  }

  .choice:hover {
    transform: scale(1.08) rotate(2deg);
    box-shadow: 0 20px 50px rgba(255,255,255,0.2);
  }

  .choice::before {
    content: "";
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: brightness(0.6);
    transition: filter 0.6s;
  }

  .choice:hover::before {
    filter: brightness(1);
  }

  .choice h2 {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    letter-spacing: 2px;
    text-shadow: 0 3px 10px rgba(0,0,0,0.6);
  }

  /* Spécifique papillons */
  .papillons::before {
    background-image: url('images_ui/papillon_bg.jpg');
  }
  .papillons:hover::before {
    filter: brightness(1.1) saturate(1.3);
  }

  /* Spécifique oiseaux */
  .oiseaux::before {
    background-image: url('images_ui/oiseau_bg.jpg');
  }
  .oiseaux:hover::before {
    filter: brightness(1.1) saturate(1.3);
  }

  /* Animation du titre principal */
  .title {
    position: absolute;
    top: 40px;
    width: 100%;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    letter-spacing: 3px;
    color: #fff;
    z-index: 3;
    text-shadow: 0 5px 15px rgba(0,0,0,0.5);
    animation: fadeIn 2s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<canvas id="background"></canvas>

<h1 class="title">Exploration du Grand Est</h1>

<div class="container">
  <div class="choice papillons" onclick="navigate('index_papillons.html')">
    <h2>Papillons</h2>
  </div>
  <div class="choice oiseaux" onclick="navigate('index_oiseaux.html')">
    <h2>Oiseaux</h2>
  </div>
</div>

<script>
  // Animation douce du fond avec des particules flottantes
  const canvas = document.getElementById('background');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.radius = Math.random() * 2 + 1;
      this.speedX = (Math.random() - 0.5) * 0.4;
      this.speedY = (Math.random() - 0.5) * 0.4;
      this.alpha = Math.random() * 0.5 + 0.2;
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
      ctx.fill();
    }

    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
      if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
    }
  }

  for (let i = 0; i < 200; i++) particles.push(new Particle());

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
  }
  animate();

  // Animation de transition
  function navigate(url) {
    document.body.style.transition = "opacity 0.8s ease";
    document.body.style.opacity = 0;
    setTimeout(() => { window.location.href = url; }, 800);
  }
</script>

</body>
</html>
