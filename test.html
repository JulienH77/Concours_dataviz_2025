<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carte des zones EPCI avec motifs</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { width: 100%; height: 80%; background: #f0f0f0; }
    #controls { height: 20%; background: #f8f8f8; padding: 10px; display: flex; justify-content: center; gap: 10px; }
    .papillon { padding: 10px; border: 1px solid #ccc; cursor: pointer; }
    .papillon.active { background: #e0e0ff; }
    .epci { stroke: #333; stroke-width: 0.5; fill: rgba(0, 0, 255, 0.1); pointer-events: all; }
    .epci.selected { fill: red; stroke: black; stroke-width: 2; }
    .label { font-size: 12px; fill: #000; text-anchor: middle; pointer-events: none; }
  </style>
</head>
<body>
  <div id="controls">
    <div class="papillon" data-id="1">Aglais io</div>
    <div class="papillon" data-id="2">Aglais urticae</div>
    <div class="papillon" data-id="3" class="active">Gonepteryx rhamni</div>
    <div class="papillon" data-id="4">Vanessa atalanta</div>
    <div class="papillon" data-id="5">Vanessa cardui</div>
  </div>
  <div id="map"></div>
  <script>
    // Mapping des IDs numériques aux chemins des motifs
    const papillonPatternMap = {
      "1": "images_papillons/pattern_AGLAIS_IO.png",
      "2": "images_papillons/pattern_AGLAIS_URTICAE.png",
      "3": "images_papillons/pattern_GONEPTERYX_RHAMNI.png",
      "4": "images_papillons/pattern_VANESSA_ATALANTA.png",
      "5": "images_papillons/pattern_VANESSA_CARDUI.png"
    };

    // État global
    let selectedPapillonId = 3;
    const svg = d3.select("#map").append("svg").attr("width", "100%").attr("height", "100%");
    const patternCreated = new Set();

    // Crée un motif SVG pour un papillon donné
    function ensurePattern(url, pid) {
      if (patternCreated.has(pid)) return;
      const defs = svg.append("defs");
      const pattern = defs.append("pattern")
        .attr("id", pid)
        .attr("patternUnits", "userSpaceOnUse")
        .attr("width", 100)
        .attr("height", 100);

      // Ajoute un rectangle de fond pour vérifier que le motif est créé
      pattern.append("rect")
        .attr("width", 100)
        .attr("height", 100)
        .attr("fill", "pink"); // Fond rose pour vérifier que le motif est créé

      // Ajoute l'image du motif
      pattern.append("image")
        .attr("href", url)
        .attr("width", 100)
        .attr("height", 100)
        .attr("preserveAspectRatio", "xMidYMid slice")
        .on("error", () => console.error(`Erreur de chargement de l'image: ${url}`));

      patternCreated.add(pid);
      console.log(`Motif ${pid} créé avec succès.`);
    }

    // Charge le fichier GeoJSON et dessine la carte
    d3.json("epci_grand-est.geojson").then(geojson => {
      console.log("GeoJSON chargé avec succès:", geojson.features.slice(0, 3));

      // Détermine la taille du conteneur
      const width = document.getElementById("map").clientWidth;
      const height = document.getElementById("map").clientHeight;

      // Crée une projection et un générateur de path
      const projection = d3.geoMercator().fitSize([width, height], geojson);
      const path = d3.geoPath().projection(projection);

      // Précharge les motifs pour chaque papillon
      Object.entries(papillonPatternMap).forEach(([id, url]) => {
        ensurePattern(url, `pattern_${id}`);
      });

      // Dessine les zones EPCI
      svg.selectAll("path.epci")
        .data(geojson.features)
        .enter()
        .append("path")
        .attr("class", "epci")
        .attr("d", path)
        .attr("fill", "rgba(0, 0, 255, 0.1)")
        .attr("stroke", "blue")
        .on("click", function(event, d) {
          const couleur = d.properties.couleur;
          console.log("Zone EPCI cliquée !", couleur);
          if (couleur === selectedPapillonId) {
            const pid = `pattern_${selectedPapillonId}`;
            d3.select(this)
              .attr("fill", `url(#${pid})`)
              .attr("stroke", "black")
              .attr("stroke-width", 2);
            console.log(`Motif ${pid} appliqué !`);
          }
        });

      // Ajoute les labels
      svg.selectAll("text.label")
        .data(geojson.features)
        .enter()
        .append("text")
        .attr("class", "label")
        .attr("x", d => path.centroid(d)[0])
        .attr("y", d => path.centroid(d)[1])
        .text(d => d.properties.couleur);
    }).catch(error => {
      console.error("Erreur lors du chargement du GeoJSON:", error);
      d3.select("#map").append("div")
        .style("color", "red")
        .style("text-align", "center")
        .style("padding", "20px")
        .text(`Erreur de chargement du GeoJSON : ${error.message}`);
    });

    // Gestion des contrôles de sélection des papillons
    document.querySelectorAll(".papillon").forEach(papillon => {
      papillon.addEventListener("click", () => {
        document.querySelectorAll(".papillon").forEach(p => p.classList.remove("active"));
        papillon.classList.add("active");
        selectedPapillonId = parseInt(papillon.dataset.id);
        console.log(`Papillon sélectionné : ${selectedPapillonId}`);
      });
    });
  </script>
</body>
</html>
