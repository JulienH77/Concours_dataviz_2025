<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test de coloration des zones EPCI</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { width: 100%; height: 100%; background: #f0f0f0; }
    .epci { stroke: #333; stroke-width: 0.5; fill: rgba(0, 0, 255, 0.1); }
    .epci.selected { fill: red; stroke: black; stroke-width: 2; }
    .label { font-size: 12px; fill: #000; text-anchor: middle; pointer-events: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // ID du papillon sélectionné (par défaut : 3)
    const selectedPapillonId = 3;

    // Charge le fichier GeoJSON et dessine la carte
    d3.json("epci_grand-est.geojson").then(geojson => {
      console.log("GeoJSON chargé avec succès:", geojson.features.slice(0, 3));

      // Crée le conteneur SVG
      const svg = d3.select("#map").append("svg")
        .attr("width", "100%")
        .attr("height", "100%");

      // Détermine la taille du conteneur
      const width = document.getElementById("map").clientWidth;
      const height = document.getElementById("map").clientHeight;

      // Crée une projection et un générateur de path
      const projection = d3.geoMercator().fitSize([width, height], geojson);
      const path = d3.geoPath().projection(projection);

      // Dessine les zones EPCI
      svg.selectAll("path.epci")
        .data(geojson.features)
        .enter()
        .append("path")
        .attr("class", "epci")
        .attr("d", path)
        .on("click", function(event, d) {
          const couleur = d.properties.couleur;
          console.log("Zone EPCI cliquée !", couleur);
          if (couleur === selectedPapillonId) {
            d3.select(this)
              .classed("selected", true)
              .attr("fill", "red")
              .attr("stroke", "black")
              .attr("stroke-width", 2);
            console.log("Zone colorée en rouge !");
          }
        });

      // Ajoute les labels
      svg.selectAll("text.label")
        .data(geojson.features)
        .enter()
        .append("text")
        .attr("class", "label")
        .attr("x", d => path.centroid(d)[0])
        .attr("y", d => path.centroid(d)[1])
        .text(d => d.properties.couleur);
    }).catch(error => {
      console.error("Erreur lors du chargement du GeoJSON:", error);
      d3.select("#map").append("div")
        .style("color", "red")
        .style("text-align", "center")
        .style("padding", "20px")
        .text(`Erreur de chargement du GeoJSON : ${error.message}`);
    });
  </script>
</body>
</html>
