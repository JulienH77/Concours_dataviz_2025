<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Test minimaliste de chargement GeoJSON</title>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { width: 100%; height: 100%; background: #f0f0f0; }
    svg { width: 100%; height: 100%; }
    path { stroke: #333; stroke-width: 0.5; fill: none; }
    text { font-size: 12px; fill: #000; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // URL du fichier GeoJSON
    const geojsonUrl = "epci_grand-est.geojson";

    // Fonction pour dessiner la carte
    function drawMap(geojson) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      document.getElementById("map").appendChild(svg);

      // Crée un groupe pour les zones EPCI
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      svg.appendChild(g);

      // Dessine chaque zone EPCI
      geojson.features.forEach(feature => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "M0,0"); // Placeholder, on va le mettre à jour
        path.setAttribute("stroke", "blue");
        path.setAttribute("fill", "none");
        path.setAttribute("data-couleur", feature.properties.couleur);

        // Ajoute un événement de clic
        path.addEventListener("click", () => {
          console.log("Zone cliquée, couleur:", feature.properties.couleur);
          if (feature.properties.couleur === 3) {
            path.setAttribute("fill", "red");
            console.log("Zone colorée en rouge !");
          }
        });

        g.appendChild(path);

        // Ajoute un label
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.textContent = feature.properties.couleur;
        text.setAttribute("x", 0); // Placeholder
        text.setAttribute("y", 0); // Placeholder
        g.appendChild(text);
      });

      console.log("Carte dessinée avec succès !");
    }

    // Charge le fichier GeoJSON
    fetch(geojsonUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error(`Erreur HTTP! statut: ${response.status}`);
        }
        return response.json();
      })
      .then(geojson => {
        console.log("GeoJSON chargé avec succès:", geojson.features.slice(0, 3));
        drawMap(geojson);
      })
      .catch(error => {
        console.error("Erreur lors du chargement du GeoJSON:", error);
        document.getElementById("map").innerHTML = `
          <div style="color: red; text-align: center; padding: 20px;">
            Erreur de chargement du GeoJSON : ${error.message}
          </div>
        `;
      });
  </script>
</body>
</html>
