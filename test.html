<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vérification du chargement GeoJSON</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 5px; max-height: 300px; overflow-y: auto; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>Vérification du chargement GeoJSON</h1>
  <div id="status"></div>
  <div id="data"></div>

  <script>
    // URL du fichier GeoJSON
    const geojsonUrl = "epci_grand-est.geojson";

    // Affiche un message dans la page
    function showMessage(message, isError = false) {
      const statusDiv = document.getElementById("status");
      statusDiv.innerHTML = `<p class="${isError ? 'error' : 'success'}">${message}</p>`;
    }

    // Affiche les données GeoJSON
    function showData(geojson) {
      const dataDiv = document.getElementById("data");
      dataDiv.innerHTML = `<h2>Données GeoJSON chargées :</h2>
                           <pre>${JSON.stringify(geojson.features.slice(0, 3), null, 2)}</pre>`;
    }

    // Charge le fichier GeoJSON
    fetch(geojsonUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error(`Erreur HTTP! statut: ${response.status}`);
        }
        return response.json();
      })
      .then(geojson => {
        showMessage("GeoJSON chargé avec succès !");
        showData(geojson);
      })
      .catch(error => {
        showMessage(`Erreur lors du chargement du GeoJSON : ${error.message}`, true);
        console.error("Erreur détaillée :", error);
      });
  </script>
</body>
</html>
