<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Test de coloration des zones EPCI</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #svgContainer { height: 100%; background: #fff; }
    svg { width: 100%; height: 100%; }
    .epci { stroke: #333; stroke-width: 0.5; fill: #fff; }
    .label { font-size: 12px; fill: #000; text-anchor: middle; }
  </style>
</head>
<body>
  <div id="svgContainer"><svg id="svg"></svg></div>
  <script>
    // État global
    const svg = d3.select("#svg");
    const container = document.getElementById("svgContainer");
    let selectedPapillonId = 3; // ID numérique du papillon sélectionné (par défaut : 3)

    // Dessine la carte
    function draw() {
      svg.selectAll("*").remove();
      const w = container.clientWidth || 1000;
      const h = container.clientHeight || 600;
      svg.attr("viewBox", `0 0 ${w} ${h}`);

      // Charge uniquement les données EPCI
      d3.json("epci_grand-est.geojson").then(epci => {
        const projection = d3.geoMercator();
        const path = d3.geoPath(projection);
        projection.fitSize([w, h], epci);

        // Dessine les zones EPCI
        svg.selectAll("path.epci")
          .data(epci.features)
          .enter()
          .append("path")
          .attr("class", "epci")
          .attr("d", path)
          .attr("fill", "#fff")
          .attr("stroke", "#333")
          .on("click", function(event, d) {
            const featNum = d.properties.couleur; // Valeur numérique (ex: 3)
            console.log("Zone EPCI cliquée, couleur :", featNum);
            if (featNum === selectedPapillonId) {
              d3.select(this).attr("fill", "red"); // Coloration en rouge
              console.log("Zone colorée en rouge !");
            } else {
              console.log("Zone non autorisée pour ce papillon.");
            }
          });

        // Ajoute les labels pour débogage
        svg.selectAll("text.label")
          .data(epci.features)
          .enter()
          .append("text")
          .attr("class", "label")
          .attr("x", d => path.centroid(d)[0])
          .attr("y", d => path.centroid(d)[1])
          .text(d => d.properties.couleur)
          .style("font-size", "12px")
          .style("fill", "#000")
          .style("text-anchor", "middle");
      }).catch(err => console.error("Erreur chargement GeoJSON:", err));
    }

    // Initialisation
    draw();
    window.addEventListener("resize", draw);
  </script>
</body>
</html>
